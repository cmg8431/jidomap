name: data-refresh

on:
  schedule:
    # 매월 1일 03:17 UTC — OSM 원천에서 한국 지리 데이터 재추출
    - cron: '17 3 1 * *'
  workflow_dispatch: {}
  push:
    branches: ['claude/**']
    paths:
      - 'tools/pipeline/**'
      - '.github/workflows/data-refresh.yml'

permissions:
  contents: write
  pull-requests: write

# 연속 push 시 순차 실행 — 앞 런의 데이터 커밋과 non-fast-forward 충돌 방지
concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 트리거 시점 SHA 가 아니라 실행 시점 브랜치 팁 — 큐에서 기다린 런도 최신 위에서 돈다
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild Korea geo data from OSM
        run: bun run generate
        working-directory: tools/pipeline

      # 브랜치 push 트리거: 새 브랜치 생성 없이 같은 브랜치로 직접 커밋
      # (GITHUB_TOKEN 은 새 워크플로 파일이 든 브랜치를 만들 수 없다)
      - name: Commit data back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/data
          if git diff --cached --quiet; then
            echo "데이터 변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(data): Korea geo refresh (CI)"
          git push

      - name: Open PR if data changed
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(data): monthly Korea geo refresh'
          title: 'chore(data): monthly Korea geo refresh'
          body: |
            tools/pipeline 자동 실행 결과입니다.
            - 원천: OpenStreetMap (Overpass API)
            - 검토 포인트: 노선/역 수 급감 여부, meta.json updatedAt
          branch: data-refresh
          delete-branch: true
